- id: digi-handboek
  naam: Digi Handboek
  omschrijving: De centrale plek met de informatie die je bij het Digi Gilde nodig hebt.
  adres: https://digihandboek.rijks.app/
  forge: github
  repo: DigiGilde/handboek
  standaardbranch: main
  content:
    pad: docs
    patroon: '**/*.md'
    schema: digi-handboek
    afbeeldingen:
      pad: docs/afbeeldingen/{paginaslug}
      verwijzing: relatief
  review:
    model: goedkeuring
    mergen-vanuit-schrijver: true
    redactie:
      - naam@rijksoverheid.nl
  identiteit:
    toegestaan: [anoniem, gekoppeld, op-naam]
  preview:
    soort: bij-push
    url: 'https://plak.rijks.app/digigilde/handboek/_preview/pr-{nummer}/'
  schrijfwijzer: digi-handboek.md

- id: moza-site
  naam: MijnOverheid Zakelijk
  omschrijving: Een overheidsbrede samenwerking om de dienstverlening voor ondernemers te verbeteren.
  adres: https://mijnoverheidzakelijk.nl/
  forge: github
  repo: MinBZK/moza-site
  standaardbranch: main
  content:
    pad: content
    patroon: '**/*.md'
    schema: moza-site
    uitsluiten: ['documenten/**']
    afbeeldingen:
      pad: '{paginamap}/images'
      verwijzing: relatief
  review:
    model: goedkeuring
    mergen-vanuit-schrijver: true
    redactie: [redactie@example.org]
  identiteit:
    toegestaan: [anoniem, gekoppeld]
  preview:
    soort: bij-label
    label: preview
    url: 'https://web-pr-{nummer}-mzs-3ik.rig.prd1.gn2.quattro.rijksapps.nl'
  schrijfwijzer: moza-site.md
  mermaid:
    tokens:
      --color-bg-light: { licht: '#f0f7ff', donker: '#172538' }
      --color-rijks-oranje: { licht: '#e17000', donker: '#e17000' }
      --color-text: { licht: '#091629', donker: '#ebeef2' }
