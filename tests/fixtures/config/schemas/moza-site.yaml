titel: veld:title
velden:
  title: { type: tekst, verplicht: true }
  description: { type: tekst, verplicht: true }
  weight: { type: getal, verborgen: true }
  date: { type: datum, alleen-in: ['weekly/**'] }
nieuwe-pagina:
  soorten:
    - naam: Weekly
      map: 'weekly/{jaar}'
      bestandsnaam: '{datum}'
      velden: [title, date]
    - naam: Handboekpagina
      mappen: ['handboek/*']
    - naam: Onderwerp
      mappen: [onderwerpen]
